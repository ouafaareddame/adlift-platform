server:
  port: 8082

spring:
  application:
    name: campaign-service
  datasource:
    url: jdbc:postgresql://localhost:5434/campaign_db
    username: campaign_user
    password: campaign_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: unSecretTresLongEtAleatoirePourSignerLesTokensJWT1234567890

logging:
  level:
    com.adlift: DEBUG