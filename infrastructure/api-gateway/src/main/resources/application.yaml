server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 8s
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**

            - id: campaign-service
              uri: ${CAMPAIGN_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/campaigns/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/notifications/**

            - id: auth-service-members
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/members/**

            - id: auth-service-tenants
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/tenants/**

jwt:
  secret: unSecretTresLongEtAleatoirePourSignerLesTokensJWT1234567890

logging:
  level:
    com.adlift: INFO
    org.springframework.cloud.gateway: INFO
